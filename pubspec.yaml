name: dry4dart
description: Finds candidate duplicate Dart code across files and directories using structural fingerprints and Jaccard similarity.
version: 0.1.0
repository: https://github.com/brackendev/dry4dart

topics:
  - cli
  - static-analysis
  - code-analysis
  - duplicate-code
  - dart

environment:
  sdk: ^3.9.0

executables:
  dry4dart:

dependencies:
  analyzer: '>=9.0.0 <11.0.0'
  args: ^2.5.0
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
